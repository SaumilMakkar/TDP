<div class="view" id="view-dashboard">
  <div class="overview-stepper" id="overview-stepper" aria-hidden="true">
    <div class="overview-stepper-track">
      <div class="overview-step">
        <div class="overview-step-dot overview-step-dot--done">✓</div>
        <span class="overview-step-label">Prescriber</span>
      </div>
      <div class="overview-step-connector overview-step-connector--done"></div>
      <div class="overview-step">
        <div class="overview-step-dot overview-step-dot--done">✓</div>
        <span class="overview-step-label">Pharmacist</span>
      </div>
      <div class="overview-step-connector overview-step-connector--done"></div>
      <div class="overview-step">
        <div class="overview-step-dot overview-step-dot--done">✓</div>
        <span class="overview-step-label">AI Processing</span>
      </div>
      <div class="overview-step-connector overview-step-connector--done"></div>
      <div class="overview-step">
        <div class="overview-step-dot overview-step-dot--current">4</div>
        <span class="overview-step-label overview-step-label--current">Overview</span>
      </div>
      <div class="overview-step-connector"></div>
      <div class="overview-step">
        <div class="overview-step-dot">5</div>
        <span class="overview-step-label">Review</span>
      </div>
    </div>
  </div>

  <div class="page-header page-header-actions">
    <div>
      <h2 id="dashboard-title">All Prescriptions</h2>
      <p id="dashboard-subtitle">Complete overview of all submitted prescriptions</p>
    </div>
  </div>
  <div id="dashboard-stats"></div>
  <div class="card" id="dashboard-table-area">
    <div id="dashboard-content">
      <div class="loading-state">Loading prescriptions...</div>
    </div>
  </div>
</div>
